name: Clean Test Contacts

on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and clean contacts
        run: |
          CONTACTS=$(curl -sf "https://iptv-kv-reader.medmaar.workers.dev/contacts")
          echo "Fetched contacts"

          # Use node to filter (available on all runners)
          CLEANED=$(node -e "
            const data = JSON.parse(process.env.CONTACTS || '{}');
            const patterns = ['elmaaroufi','elmaarccd','elmaarouc','elmaarcsc'];
            const before = Object.keys(data).length;
            const cleaned = Object.fromEntries(
              Object.entries(data).filter(([k]) =>
                !patterns.some(p => k.toLowerCase().includes(p))
              )
            );
            const after = Object.keys(cleaned).length;
            process.stderr.write('Removed ' + (before-after) + ' test entries, kept ' + after + ' real contacts\n');
            process.stdout.write(JSON.stringify(cleaned));
          " CONTACTS="$CONTACTS")

          echo "Posting cleaned contacts..."
          curl -sf -X POST \
            "https://iptv-kv-reader.medmaar.workers.dev/contacts" \
            -H "Content-Type: application/json" \
            -d "$CLEANED"
          echo "Done"

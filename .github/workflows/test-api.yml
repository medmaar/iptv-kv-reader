name: Test Panel API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Clean test contacts from KV
        run: |
          echo "=== Fetching current contacts ==="
          CONTACTS=$(curl -s "https://iptv-kv-reader.medmaar.workers.dev/contacts")
          echo "$CONTACTS"

          echo ""
          echo "=== Removing test email entries ==="
          CLEANED=$(echo "$CONTACTS" | python3 -c "
import sys, json

data = json.load(sys.stdin)

TEST_PATTERNS = [
  'elmaaroufi',
  'elmaarccd',
  'elmaarouc',
  'elmaarcsc',
  'elmaarouscs',
]

before = len(data)
cleaned = {k: v for k, v in data.items()
           if not any(p in k.lower() for p in TEST_PATTERNS)}
after = len(cleaned)

import sys
sys.stderr.write(f'Removed {before - after} test entries, kept {after} real contacts\n')
print(json.dumps(cleaned))
")

          echo ""
          echo "=== Posting cleaned contacts ==="
          RESULT=$(curl -s -X POST \
            "https://iptv-kv-reader.medmaar.workers.dev/contacts" \
            -H "Content-Type: application/json" \
            -d "$CLEANED")
          echo "Result: $RESULT"
          echo "Done."

name: Run KV Migration

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Call /build-keys endpoint (backfill __keys__ index)
        run: |
          echo "Calling build-keys..."
          RESULT=$(curl -sf -X POST "https://iptv-kv-reader.medmaar.workers.dev/build-keys")
          echo "Result: $RESULT"
